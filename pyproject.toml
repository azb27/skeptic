[project]
name = "skeptic"
version = "0.1.0"
description = "A research agent that tries to kill trading strategies: leakage, cost and multiple-testing checks, measured on a bench of planted flaws."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "anthropic>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skeptic"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["bench/cases", "private"]  # bench cases are test data: deliberately imperfect code

[tool.ruff.lint]
# explicit, so every ruff version enforces the same rules
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ISC", "PLC"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "ISC004"]  # ISC004: long markdown lines are split on purpose
